name: AIMS release candidate feedback
description: Report a reproducible bug, workflow problem, successful handoff, or usability issue found while testing AIMS.
title: "[Tester feedback]: "
labels:
  - tester-feedback
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing AIMS. Everything submitted through this form becomes public.

        Replace sensitive or identifying data with placeholders such as `<USER>`, `<HOST>`, `<AIMS_HOME>`, `<PRIVATE_REPO>`, and `<SESSION_ID>`. Do not include credentials, private keys, credential-bearing URLs, private repository data, usernames, email addresses, hostnames, IP addresses, organization names, absolute home-directory paths, proprietary file contents, complete logs, screenshots, or archives.

        Report suspected vulnerabilities privately through a [GitHub security advisory](https://github.com/visaroy/aims/security/advisories/new), not this form. See [SECURITY.md](https://github.com/visaroy/aims/blob/main/SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area tested
      options:
        - Installation or update
        - Configuration or aims doctor
        - Starting or saving a session
        - Checkpointing
        - Handoff or adoption
        - Multi-machine synchronization
        - Publishing or Git integration
        - Agent wiring
        - Documentation or usability
        - Other
    validations:
      required: true
  - type: input
    id: aims-version
    attributes:
      label: AIMS version
      description: Run `aims version`. Enter `unknown` if the command cannot run.
      placeholder: 1.0.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and architecture
      description: Do not include the hostname.
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: input
    id: bash-version
    attributes:
      label: Bash version
      description: Paste the first line from `bash --version`.
      placeholder: GNU bash, version 3.2.57(1)-release
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agents used
      description: Select every agent involved in the test.
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - OpenCode
        - Gemini CLI
        - Other or unknown
    validations:
      required: true
  - type: input
    id: agent-versions
    attributes:
      label: Agent versions
      description: Optional, but useful for agent-wiring or behavior problems.
      placeholder: Codex CLI 1.x; Claude Code 2.x
  - type: dropdown
    id: topology
    attributes:
      label: Test topology
      options:
        - One machine, one agent
        - One machine, multiple agents
        - Two machines, same operating system
        - Two machines, different operating systems
        - More than two machines
        - Disposable local simulation from docs/TESTING.md
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Often
        - Sometimes
        - Happened once
        - Not applicable; reporting a successful test
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Reproduction or test steps
      description: Give the smallest repeatable sequence. Identify machine transitions with anonymous placeholders and include the AIMS commands or natural-language requests given to the agents.
      placeholder: |
        1. On `<MACHINE_A>`, I asked `<AGENT_A>` to start a session.
        2. The agent ran `aims ...`.
        3. On `<MACHINE_B>`, I asked `<AGENT_B>` to adopt it.
        4. The result appeared after ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should AIMS or the agent have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact sanitized error and exit status when known, or explain what worked.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized `aims doctor` output
      description: Replace data-repository and artifact-store paths with `<AIMS_HOME>` and `<AIMS_ARTIFACTS>`. Remove repository URLs, identities, hostnames, IP addresses, and credentials. Enter `Not run:` followed by the reason if the command cannot run.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional sanitized log excerpt
      description: Optional. Include only the shortest excerpt around the failure. Do not upload complete logs, screenshots, or archives.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      description: Submission is blocked until this safety check is confirmed.
      options:
        - label: I reviewed every field and confirm that this public report contains no secrets, credentials, private repository data, personal identifiers, infrastructure details, or confidential file contents.
          required: true
